name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 16
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-client-16
      - name: Apply migrations and run every database check
        run: bash scripts/test-db.sh

  restore-drill:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 16
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-client-16
      - name: Backup and restore drill
        run: bash scripts/backup-restore-drill.sh

  app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Installs the versions pinned in pnpm-lock.yaml. Not frozen: when a push
      # changes package.json, the Lockfile workflow commits the updated lockfile
      # separately, so this run resolves the new entries itself.
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm lint
        if: ${{ !cancelled() }}
      - run: pnpm typecheck
        if: ${{ !cancelled() }}
      - run: pnpm check
        if: ${{ !cancelled() }}
      - run: pnpm test
        if: ${{ !cancelled() }}
      - run: pnpm test:template
        if: ${{ !cancelled() }}
      - run: pnpm build
        if: ${{ !cancelled() }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
